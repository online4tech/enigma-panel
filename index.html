<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>Enigma Panel — بانل انيجما٢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e1c;
    --bg2:#0d1226;
    --surface:#131830;
    --surface2:#171e3a;
    --surface3:#1c2447;
    --line:#232b4d;
    --line2:#2c3660;
    --gold:#e9b949;
    --gold2:#c9962e;
    --gold-soft:rgba(233,185,73,.14);
    --text:#eef1fa;
    --muted:#98a1c0;
    --muted2:#6d7699;
    --green:#37c978;
    --red:#f0524f;
    --yellow:#f5c542;
    --blue:#4f8ef7;
    --radius:14px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(60,72,140,.28), transparent 60%),
      radial-gradient(700px 420px at 5% 110%, rgba(233,185,73,.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"Tajawal","Cairo",system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button,[role="button"],input,select{font-family:inherit}
  button{min-height:40px;cursor:pointer}
  ::selection{background:var(--gold);color:#14100a}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 22px 10px;
    max-width:1460px;margin:0 auto;
  }
  .brand{text-align:right}
  .brand .name{
    font-family:"Cairo",sans-serif;font-weight:900;font-size:30px;line-height:1;
    color:var(--gold);letter-spacing:.2px;direction:ltr;
  }
  .brand .sub{color:var(--muted);font-size:13.5px;margin-top:5px;font-weight:500}
  .brand .sub b{color:var(--text);font-weight:700}
  .clockbox{text-align:left;margin-inline-start:auto}
  .clock{
    font-family:"Cairo",sans-serif;font-weight:800;font-size:32px;line-height:1;
    background:var(--surface);border:1px solid var(--line);
    padding:7px 14px;border-radius:10px;display:inline-block;direction:ltr;
    font-variant-numeric:tabular-nums;
  }
  .date{color:var(--muted);font-size:13.5px;margin-top:7px;font-weight:500}
  .netstat{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-top:4px}
  .netstat .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(55,201,120,.8)}
  .top-actions{display:flex;gap:10px;align-items:center}
  .icon-btn{
    width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface);color:var(--text);display:grid;place-items:center;
    transition:border-color .15s, background .15s;
  }
  .icon-btn:hover{border-color:var(--gold);background:var(--surface2)}
  .icon-btn svg{width:21px;height:21px}
  .search-wrap{
    display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:0 18px;height:48px;
    min-width:min(430px,100%);flex:1;max-width:520px;
  }
  .search-wrap:focus-within{border-color:var(--gold)}
  .search-wrap svg{width:19px;height:19px;color:var(--muted);flex:none}
  .search-wrap input{
    background:none;border:none;outline:none;color:var(--text);
    font-size:15.5px;width:100%;height:100%;
  }
  .search-wrap input::placeholder{color:var(--muted)}

  /* ---------- Layout ---------- */
  .layout{
    max-width:1460px;margin:0 auto;padding:8px 22px 96px;
    display:grid;grid-template-columns:250px 1fr 300px;gap:16px;align-items:start;
  }
  .panel{
    background:linear-gradient(180deg,var(--surface2),var(--surface));
    border:1px solid var(--line);border-radius:var(--radius);
  }
  .panel h3{
    margin:0;padding:13px 18px 9px;color:var(--muted);font-size:13px;font-weight:700;
    letter-spacing:.02em;
  }

  /* Right nav */
  .nav-list{list-style:none;margin:0;padding:0 10px 12px;display:flex;flex-direction:column;gap:4px}
  .nav-list button{
    width:100%;display:flex;align-items:center;gap:11px;text-align:right;
    background:none;border:1px solid transparent;border-radius:10px;color:var(--text);
    font-size:17px;font-weight:700;padding:9px 12px;min-height:46px;
    transition:background .15s,border-color .15s;
  }
  .nav-list button svg{width:21px;height:21px;color:var(--muted);flex:none}
  .nav-list button:hover{background:var(--surface3)}
  .nav-list button.active{
    background:var(--surface3);border-color:var(--line2);color:var(--gold);
    box-shadow:inset -3px 0 0 var(--gold);
  }
  .nav-list button.active svg{color:var(--gold)}

  /* Center head */
  .center-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 4px 12px;flex-wrap:wrap}
  .center-head h1{font-family:"Cairo",sans-serif;font-size:27px;font-weight:800;margin:0}
  .center-head .count{color:var(--muted);font-size:14.5px;font-weight:500}
  .view-toggle{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .view-toggle button{
    border:none;background:none;color:var(--muted);border-radius:8px;
    padding:6px 16px;font-size:14.5px;font-weight:700;min-height:36px;
    display:flex;align-items:center;gap:7px;
  }
  .view-toggle button svg{width:16px;height:16px}
  .view-toggle button.active{background:var(--gold);color:#171106}

  /* List view */
  .item-list{display:flex;flex-direction:column;gap:9px}
  .row-item{
    display:flex;align-items:center;gap:15px;width:100%;text-align:right;
    background:linear-gradient(180deg,var(--surface2),var(--surface));
    border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--text);
    transition:border-color .15s, transform .15s;min-height:64px;
  }
  .row-item:hover{border-color:var(--line2)}
  .row-item.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 6px 22px rgba(0,0,0,.35)}
  .row-item .thumb{
    width:46px;height:46px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:#0d1122;border:1px solid var(--line2);
  }
  .row-item .thumb svg{width:26px;height:26px}
  .row-item .tt{flex:1;min-width:0}
  .row-item .tt .t1{font-size:18.5px;font-weight:800;font-family:"Cairo",sans-serif}
  .row-item.selected .tt .t1{color:var(--gold)}
  .row-item .tt .t2{color:var(--muted);font-size:14px;margin-top:2px}
  .row-item .go{color:var(--muted2);flex:none;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
  .row-item.selected .go{color:var(--gold)}

  /* Grid view */
  .grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px}
  .tile{
    background:linear-gradient(180deg,var(--surface2),var(--surface));
    border:1px solid var(--line);border-radius:14px;padding:20px 16px 16px;color:var(--text);
    display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
    min-height:158px;transition:border-color .15s, transform .15s;
  }
  .tile:hover{border-color:var(--line2);transform:translateY(-2px)}
  .tile.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .tile .thumb{width:58px;height:58px;border-radius:12px;display:grid;place-items:center;background:#0d1122;border:1px solid var(--line2)}
  .tile .thumb svg{width:34px;height:34px}
  .tile .t1{font-size:19px;font-weight:800;font-family:"Cairo",sans-serif}
  .tile.selected .t1{color:var(--gold)}
  .tile .t2{color:var(--muted);font-size:13.5px;line-height:1.55}

  /* System panel */
  .sys-body{padding:2px 18px 16px;display:flex;flex-direction:column;gap:9px;font-size:15px}
  .sys-body .line{display:flex;justify-content:space-between;gap:10px}
  .sys-body .k{color:var(--muted)}
  .sys-body .v{font-weight:700;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
  .sys-body .v.ar{direction:rtl;text-align:right}
  .sys-body .online{color:var(--green)}
  .bar{height:8px;border-radius:99px;background:#0b0f20;border:1px solid var(--line);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--gold))}
  .bar.green i{background:linear-gradient(90deg,#1f9d5c,var(--green))}
  .speeds{border-top:1px dashed var(--line2);padding-top:11px;margin-top:3px;display:flex;flex-direction:column;gap:7px}
  .speeds .v{color:var(--gold)}

  /* ---------- Plugins browser: commands catalog ---------- */
  function currentPlugins(){
    var list=PLUGINS[state.category]||[];
    if(!state.query) return list;
    var q=state.query.toLowerCase();
    return list.filter(function(p){
      return p.name.toLowerCase().indexOf(q)>-1 || p.desc.toLowerCase().indexOf(q)>-1 || p.path.toLowerCase().indexOf(q)>-1;
    });
  }
  function catInfo(){
    return CATEGORIES.filter(function(c){return c.id===state.category;})[0]||null;
  }
  function renderCats(){
    $('catList').innerHTML=CATEGORIES.map(function(c){
      return '<li><button data-cat="'+escapeHtml(c.id)+'" class="'+(state.category===c.id?'active':'')+'">'
        +'<span>'+escapeHtml(c.name)+'</span><span class="cnt">'+c.count+'</span></button></li>';
    }).join('');
    var idx=CATEGORIES.findIndex(function(c){return c.id===state.category;});
    $('catFoot').textContent=(idx+1)+' / '+CATEGORIES.length;
    var btns=$('catList').querySelectorAll('button');
    for(var i=0;i<btns.length;i++){
      btns[i].addEventListener('click',function(){
        state.category=this.getAttribute('data-cat');state.selectedPlugin=0;
        renderCats();renderPlugins();
      });
    }
  }
  function renderPlugins(){
    var list=currentPlugins(),info=catInfo();
    $('catTitle').textContent=info?info.name:'الأقسام';
    $('catCount').textContent=list.length+' أمر — صفحة 1/1'+(state.query?' — نتائج البحث':'');
    var box=$('plugList');
    if(!list.length){
      box.innerHTML='<div class="empty">لا توجد أوامر في هذا القسم أو لا توجد نتائج مطابقة.</div>';
      renderDetail(null);return;
    }
    if(state.selectedPlugin>=list.length) state.selectedPlugin=0;
    box.innerHTML=list.map(function(p,i){
      return '<button class="plug-row'+(state.selectedPlugin===i?' selected':'')+'" data-idx="'+i+'">'
        +'<span class="thumb">'+ICONS.link+'</span>'
        +'<span class="nm">'+escapeHtml(p.name)+'</span>'
        +'<span class="badge free">'+(p.cmd?'أمر متاح':'بدون أمر')+'</span>'
        +'</button>';
    }).join('');
    var rows=box.querySelectorAll('[data-idx]');
    for(var i=0;i<rows.length;i++){
      rows[i].addEventListener('click',function(){
        state.selectedPlugin=parseInt(this.getAttribute('data-idx'),10);renderPlugins();
      });
    }
    renderDetail(list[state.selectedPlugin]);
  }
  function copyCatalogCommand(value){
    if(!value){toast('لا يوجد أمر متاح لهذا العنصر');return;}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(value).then(function(){toast('تم نسخ الأمر');})
        .catch(function(){toast('تعذر النسخ — انسخ الأمر يدويًا');});
    }else{
      var field=document.createElement('textarea');field.value=value;
      field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();
      try{document.execCommand('copy');toast('تم نسخ الأمر');}
      catch(e){toast('تعذر النسخ — انسخ الأمر يدويًا');}
      document.body.removeChild(field);
    }
  }
  function renderDetail(p){
    var box=$('detailCard'),info=catInfo();
    if(!p){
      box.innerHTML='<p style="color:var(--muted);margin:26px 0">اختر عنصرًا من القائمة لعرض الأمر والمسار.</p>';return;
    }
    box.innerHTML='<div class="big-thumb">'+ICONS.link+'</div>'
      +'<h2>'+escapeHtml(p.name)+'</h2>'
      +'<div class="ver">عنصر من كتالوج Enigma2</div>'
      +'<div class="meta">'
      +'<div class="line"><span class="k">القسم</span><span class="v">'+escapeHtml(info?info.name:'')+'</span></div>'
      +'<div class="line"><span class="k">مسار التثبيت</span><span class="v" style="direction:ltr;text-align:left;word-break:break-all">'+escapeHtml(p.path||'غير محدد')+'</span></div>'
      +'</div>'
      +'<p class="desc">'+escapeHtml(p.desc)+'</p>'
      +(p.cmd?'<div style="text-align:right;margin:12px 0"><div style="color:var(--gold);font-weight:800;margin-bottom:7px">أمر التثبيت</div><pre dir="ltr" style="white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;background:#090d19;border:1px solid var(--line2);border-radius:9px;padding:11px;color:var(--text);font:12px/1.7 monospace">'+escapeHtml(p.cmd)+'</pre><button class="btn gold" id="copyInstall">نسخ أمر التثبيت</button></div>':'<p class="desc">لا يوجد أمر تثبيت مسجل لهذا العنصر.</p>')
      +(p.remove_cmd?'<div style="text-align:right;margin:12px 0"><div style="color:var(--muted);font-weight:800;margin-bottom:7px">أمر الإزالة</div><pre dir="ltr" style="white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;background:#090d19;border:1px solid var(--line2);border-radius:9px;padding:11px;color:var(--text);font:12px/1.7 monospace">'+escapeHtml(p.remove_cmd)+'</pre><button class="btn" id="copyRemove">نسخ أمر الإزالة</button></div>':'')
      +'<p class="desc" style="font-size:12.5px">البانل يعرض الأوامر وينسخها فقط ولا ينفذها تلقائيًا. راجع مصدر الأمر وتوافقه مع صورة الرسيفر قبل استخدامه.</p>';
    var install=$('copyInstall');if(install) install.addEventListener('click',function(){copyCatalogCommand(p.cmd);});
    var remove=$('copyRemove');if(remove) remove.addEventListener('click',function(){copyCatalogCommand(p.remove_cmd);});
  }

  function openBrowser(){
    state.inBrowser = true;
    $('homeLayout').hidden = true;
    $('browserLayout').hidden = false;
    $('remoteHome').hidden = true;
    $('remoteBrowser').hidden = false;
    $('searchWrap').hidden = false;
    $('topActions').hidden = true;
    renderCats(); renderPlugins();
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function closeBrowser(){
    state.inBrowser = false;
    $('homeLayout').hidden = false;
    $('browserLayout').hidden = true;
    $('remoteHome').hidden = false;
    $('remoteBrowser').hidden = true;
    $('searchWrap').hidden = true;
    $('topActions').hidden = false;
    state.query=''; $('searchInput').value='';
    window.scrollTo({top:0, behavior:'smooth'});
  }
  $('backBtn').addEventListener('click', closeBrowser);

  $('searchInput').addEventListener('input', function(){
    state.query = this.value.trim();
    state.selectedPlugin = 0;
    renderPlugins();
  });

  /* ---------- Remote bar actions ---------- */
  var testing = false;
  function speedTest(){
    if (testing) return; testing = true;
    toast('جارٍ اختبار سرعة الاتصال…');
    var dl = $('dlSpeed'), ul = $('ulSpeed');
    var steps = 0;
    var iv = setInterval(function(){
      steps++;
      dl.textContent = (Math.random()*38+4).toFixed(1) + ' Mbps';
      ul.textContent = (Math.random()*14+1).toFixed(1) + ' Mbps';
      if (steps >= 9){
        clearInterval(iv);
        var fdl = (Math.random()*22+18).toFixed(1), ful = (Math.random()*6+5).toFixed(1);
        dl.textContent = fdl + ' Mbps'; ul.textContent = ful + ' Mbps';
        testing = false;
        toast('اكتمل الاختبار — التنزيل ' + fdl + ' Mbps، الرفع ' + ful + ' Mbps');
      }
    }, 160);
  }

  document.querySelectorAll('.rbtn').forEach(function(b){
    b.addEventListener('click', function(){
      var act = this.getAttribute('data-act');
      if (act === 'speed') speedTest();
      else if (act === 'network') toast('الشبكة متصلة — IP: 192.168.0.10');
      else if (act === 'hide') toast('تم إخفاء الواجهة — اضغط أي زر للإظهار');
      else if (act === 'move') toast('وضع النقل: اختر عنصرًا ثم حدد مكانه الجديد');
      else if (act === 'recent') toast('عرض أحدث الإضافات والمحتوى المتعدد');
      else if (act === 'remove'){
        var list = currentPlugins(); var p = list[state.selectedPlugin];
        if (p && p.installed){ p.installed = false; toast('تمت إزالة ' + p.name); renderPlugins(); }
        else if (p){ toast(p.name + ' غير مثبت حاليًا'); }
      }
    });
  });

  $('cartBtn').addEventListener('click', function(){ toast('سلة التنزيلات فارغة'); });
  $('bellBtn').addEventListener('click', function(){ toast('لا توجد إشعارات جديدة'); });

  /* ---------- Init ---------- */
  renderNav();
  renderCenter();
})();
</script>
</body>
</html>
